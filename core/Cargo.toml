[package]
name = "chromium-safestorage-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure-Rust recovery of the Chromium 'Safe Storage' key that encrypts Chrome/Edge/Brave cookies and logins — OS-dispatched (macOS Keychain, Windows DPAPI, Linux keyring/peanuts), audited RustCrypto only"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/chromium-safestorage-core"
readme.workspace = true
authors.workspace = true
keywords = ["forensics", "chromium", "dfir", "decryption", "cookies"]
categories.workspace = true

[lib]
name = "chromium_safestorage_core"
path = "src/lib.rs"

[dependencies]
thiserror = { workspace = true }
# OS key-recovery readers, dispatched by platform.
keychain-core = { workspace = true }
dpapi-core = { workspace = true }
serde_json = { workspace = true }
# Crypto: audited RustCrypto crates only.
pbkdf2 = { workspace = true }
aes = { workspace = true }
cbc = { workspace = true }
cipher = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
